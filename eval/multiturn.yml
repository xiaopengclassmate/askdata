# 多轮追问评测：第二句只改一个条件，其余从上文继承。
#
# 判分只看**最后一轮**的结果集——前面几轮的作用是把上下文喂进去。
# 这些追问单独发（没有上文）应该被反问拦住，这由 tests/test_clarify.py 保证。

- name: 门店营收 → 只看华南区
  turns:
    - 上个月各门店的营收
    - 那华南区呢
  sql: >
    SELECT s.name, ROUND(SUM(o.total_amount - o.discount_amount), 2)
    FROM orders o JOIN store s ON s.id = o.store_id
    WHERE o.status <> '已取消'
      AND o.paid_at >= date('now', 'start of month', '-1 month')
      AND o.paid_at <  date('now', 'start of month')
      AND s.region = '华南'
    GROUP BY s.name
  sql_pg: >
    SELECT s.name, ROUND(SUM(o.total_amount - o.discount_amount), 2)
    FROM orders o JOIN store s ON s.id = o.store_id
    WHERE o.status <> '已取消'
    AND o.paid_at >= date_trunc('month', now()) - interval '1 month'
    AND o.paid_at <  date_trunc('month', now())
    AND s.region = '华南'
    GROUP BY s.name

- name: 热销商品 → 换成按品类汇总
  turns:
    - 最近 30 天销量前 5 的商品
    - 换成按品类汇总
  sql: >
    SELECT c.name, SUM(i.quantity)
    FROM order_item i JOIN orders o ON o.id = i.order_id
    JOIN product p ON p.id = i.product_id
    JOIN category c ON c.id = p.category_id
    WHERE o.status <> '已取消' AND o.paid_at >= date('now', '-30 days')
    GROUP BY c.name ORDER BY 2 DESC
  sql_pg: >
    SELECT c.name, SUM(i.quantity)
    FROM order_item i JOIN orders o ON o.id = i.order_id
    JOIN product p ON p.id = i.product_id
    JOIN category c ON c.id = p.category_id
    WHERE o.status <> '已取消' AND o.paid_at >= current_date - 30
    GROUP BY c.name ORDER BY 2 DESC

- name: 各渠道订单量 → 看客单价
  turns:
    - 各渠道的订单量
    - 那客单价呢
  sql: >
    SELECT channel, ROUND(SUM(total_amount - discount_amount) / COUNT(DISTINCT id), 2)
    FROM orders WHERE status <> '已取消'
    GROUP BY channel

- name: 今年营收 → 对比去年
  turns:
    - 今年的总营收
    - 去年呢
  sql: >
    SELECT ROUND(SUM(total_amount - discount_amount), 2)
    FROM orders
    WHERE status <> '已取消'
      AND paid_at >= date('now', 'start of year', '-1 year')
      AND paid_at <  date('now', 'start of year')
  sql_pg: >
    SELECT ROUND(SUM(total_amount - discount_amount), 2)
    FROM orders
    WHERE status <> '已取消'
    AND paid_at >= date_trunc('year', now()) - interval '1 year'
    AND paid_at <  date_trunc('year', now())

- name: 各门店库存 → 只看深圳南山店
  turns:
    - 各门店的库存总量
    - 只看深圳南山店
  sql: >
    SELECT s.name, SUM(v.stock)
    FROM inventory_snapshot v JOIN store s ON s.id = v.store_id
    WHERE v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot)
      AND s.name = '深圳南山店'
    GROUP BY s.name

- name: 各品类销售额 → 只看家用电器
  turns:
    - 各品类的销售额
    - 只看家用电器
  sql: >
    SELECT c.name, ROUND(SUM(i.amount), 2)
    FROM order_item i JOIN product p ON p.id = i.product_id
    JOIN category c ON c.id = p.category_id
    JOIN orders o ON o.id = i.order_id
    WHERE o.status <> '已取消' AND c.name = '家用电器'
    GROUP BY c.name
