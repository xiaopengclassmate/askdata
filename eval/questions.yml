  batch: v2
  q: 最近 6 个月每个月的退款金额
  sql: "SELECT strftime('%Y-%m', created_at) AS m, ROUND(SUM(amount), 2) FROM refund WHERE status = '已退款' AND created_at >= date('now','-6 months') GROUP BY m ORDER BY m"
  sql_pg: "SELECT to_char(created_at, 'YYYY-MM') AS m, ROUND(SUM(amount), 2) FROM refund WHERE status = '已退款' AND created_at >= current_date - interval '6 months' GROUP BY m ORDER BY m"

- cat: time
  batch: v2
  q: 去年第四季度的营收
  sql: "SELECT ROUND(SUM(total_amount - discount_amount), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of year','-1 year','+9 months') AND paid_at < date('now','start of year','-1 year','+12 months')"
  sql_pg: "SELECT ROUND(SUM(total_amount - discount_amount), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('year', now()) - interval '1 year' + interval '9 months' AND paid_at < date_trunc('year', now()) - interval '1 year' + interval '12 months'"

- cat: time
  batch: v2
  q: 白天和晚上哪个时段下单更多
  sql: "SELECT CASE WHEN CAST(strftime('%H', paid_at) AS INTEGER) < 18 THEN '白天' ELSE '晚上' END AS slot, COUNT(*) FROM orders WHERE status <> '已取消' GROUP BY slot ORDER BY 2 DESC"
  sql_pg: "SELECT CASE WHEN extract(hour from paid_at) < 18 THEN '白天' ELSE '晚上' END AS slot, COUNT(*) FROM orders WHERE status <> '已取消' GROUP BY slot ORDER BY 2 DESC"

# ---- metric ----

- cat: metric
  batch: v2
  q: 全部订单的成交额是多少
  sql: "SELECT ROUND(SUM(i.amount), 2) FROM order_item i JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消'"

- cat: metric
  batch: v2
  q: 一共优惠了多少钱
  sql: "SELECT ROUND(SUM(discount_amount), 2) FROM orders WHERE status <> '已取消'"

- cat: metric
  batch: v2
  q: 平均每笔订单优惠多少
  sql: "SELECT ROUND(AVG(discount_amount), 2) FROM orders WHERE status <> '已取消'"

- cat: metric
  batch: v2
  q: 各品类的成交额
  sql: "SELECT c.name, ROUND(SUM(i.amount), 2) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消' GROUP BY c.name ORDER BY 2 DESC"

- cat: metric
  batch: v2
  q: 已售商品的总成本是多少
  sql: "SELECT ROUND(SUM(p.cost * i.quantity), 2) FROM order_item i JOIN product p ON p.id = i.product_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消'"

- cat: metric
  batch: v2
  q: 各品类的毛利率
  sql: "SELECT c.name, ROUND((SUM(i.amount) - SUM(p.cost * i.quantity)) * 1.0 / SUM(i.amount), 4) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消' GROUP BY c.name ORDER BY 2 DESC"

- cat: metric
  batch: v2
  q: 处理中的退款一共多少钱
  sql: "SELECT ROUND(SUM(amount), 2) FROM refund WHERE status = '处理中'"

- cat: metric
  batch: v2
  q: 已驳回的退款总金额
  sql: "SELECT ROUND(SUM(amount), 2) FROM refund WHERE status = '已驳回'"

# ---- group ----

- cat: group
  batch: v2
  q: 各区域有几家门店
  sql: "SELECT region, COUNT(*) FROM store GROUP BY region ORDER BY 2 DESC"

- cat: group
  batch: v2
  q: 各支付状态的订单量
  sql: "SELECT status, COUNT(*) FROM orders GROUP BY status ORDER BY 2 DESC"

- cat: group
  batch: v2
  q: 各渠道各有多少客户下过单
  sql: "SELECT channel, COUNT(DISTINCT customer_id) FROM orders WHERE status <> '已取消' GROUP BY channel ORDER BY 2 DESC"

- cat: group
  batch: v2
  q: 各个月的退款笔数
  sql: "SELECT strftime('%Y-%m', created_at) AS m, COUNT(*) FROM refund GROUP BY m ORDER BY m"
  sql_pg: "SELECT to_char(created_at, 'YYYY-MM') AS m, COUNT(*) FROM refund GROUP BY m ORDER BY m"

- cat: group
  batch: v2
  q: 在售和停售的商品各有多少个
  sql: "SELECT status, COUNT(*) FROM product GROUP BY status ORDER BY 2 DESC"

- cat: group
  batch: v2
  q: 各门店卖出过几个品类的商品
  sql: "SELECT s.name, COUNT(DISTINCT c.id) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY s.name ORDER BY 2 DESC"

# ---- topn ----

- cat: topn
  batch: v2
  q: 单笔金额最大的 5 笔订单
  sql: "SELECT order_no, ROUND(total_amount - discount_amount, 2) FROM orders WHERE status <> '已取消' ORDER BY 2 DESC LIMIT 5"

- cat: topn
  batch: v2
  q: 客单价最低的门店
  sql: "SELECT s.name FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY s.name ORDER BY SUM(o.total_amount - o.discount_amount) / COUNT(DISTINCT o.id) ASC LIMIT 1"

- cat: topn
  batch: v2
  q: 退款金额最高的 2 笔订单
  sql: "SELECT o.order_no, ROUND(r.amount, 2) FROM refund r JOIN orders o ON o.id = r.order_id WHERE r.status = '已退款' ORDER BY 2 DESC LIMIT 2"

- cat: topn
  batch: v2
  q: 库存最多的 5 个商品
  sql: "SELECT p.name, SUM(v.stock) FROM inventory_snapshot v JOIN product p ON p.id = v.product_id WHERE v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot) GROUP BY p.name ORDER BY 2 DESC LIMIT 5"

- cat: topn
  batch: v2
  q: 销量最少的 3 个品类
  sql: "SELECT c.name, SUM(i.quantity) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消' GROUP BY c.name ORDER BY 2 ASC LIMIT 3"

- cat: topn
  batch: v2
  q: 客户数最少的城市
  sql: "SELECT city, COUNT(*) FROM customer GROUP BY city ORDER BY 2 ASC LIMIT 1"

- cat: topn
  batch: v2
  q: 销售额前三的品类
  sql: "SELECT c.name, ROUND(SUM(i.amount), 2) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消' GROUP BY c.name ORDER BY 2 DESC LIMIT 3"

- cat: topn
  batch: v2
  q: 最近 90 天营收最高的门店
  sql: "SELECT s.name FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' AND o.paid_at >= date('now','-90 days') GROUP BY s.name ORDER BY SUM(o.total_amount - o.discount_amount) DESC LIMIT 1"
  sql_pg: "SELECT s.name FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' AND o.paid_at >= current_date - 90 GROUP BY s.name ORDER BY SUM(o.total_amount - o.discount_amount) DESC LIMIT 1"

# ---- ratio ----

- cat: ratio
  batch: v2
  q: 各门店营收占全部营收的比例
  sql: "SELECT s.name, ROUND(SUM(o.total_amount - o.discount_amount) * 1.0 / (SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消'), 4) FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY s.name ORDER BY 2 DESC"

- cat: ratio
  batch: v2
  q: 线上渠道的订单占全部订单的比例
  sql: "SELECT ROUND(SUM(CASE WHEN channel = '门店' THEN 0 ELSE 1 END) * 1.0 / COUNT(*), 4) FROM orders WHERE status <> '已取消'"

- cat: ratio
  batch: v2
  q: 金卡会员贡献的营收占比
  sql: "SELECT ROUND(SUM(CASE WHEN c.level = '金卡' THEN o.total_amount - o.discount_amount ELSE 0 END) * 1.0 / SUM(o.total_amount - o.discount_amount), 4) FROM orders o JOIN customer c ON c.id = o.customer_id WHERE o.status <> '已取消'"

- cat: ratio
  batch: v2
  q: 天猫渠道的退款率
  sql: "SELECT ROUND(COUNT(DISTINCT r.order_id) * 1.0 / (SELECT COUNT(DISTINCT id) FROM orders WHERE status = '已完成' AND channel = '天猫'), 4) FROM refund r JOIN orders o ON o.id = r.order_id WHERE r.status = '已退款' AND o.status = '已完成' AND o.channel = '天猫'"

- cat: ratio
  batch: v2
  q: 用了优惠的订单占比
  sql: "SELECT ROUND(SUM(CASE WHEN discount_amount > 0 THEN 1 ELSE 0 END) * 1.0 / COUNT(*), 4) FROM orders WHERE status <> '已取消'"

- cat: ratio
  batch: v2
  q: 手机数码品类的销量占全部销量的比例
  sql: "SELECT ROUND(SUM(CASE WHEN c.name = '手机数码' THEN i.quantity ELSE 0 END) * 1.0 / SUM(i.quantity), 4) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消'"

- cat: ratio
  batch: v2
  q: 华东区营收占全部营收的比例
  sql: "SELECT ROUND(SUM(CASE WHEN s.region = '华东' THEN o.total_amount - o.discount_amount ELSE 0 END) * 1.0 / SUM(o.total_amount - o.discount_amount), 4) FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消'"

- cat: ratio
  batch: v2
  q: 复购客户占下过单客户的比例
  sql: "SELECT ROUND(SUM(CASE WHEN n >= 2 THEN 1 ELSE 0 END) * 1.0 / COUNT(*), 4) FROM (SELECT customer_id, COUNT(*) AS n FROM orders WHERE status <> '已取消' GROUP BY customer_id)"

- cat: ratio
  batch: v2
  q: 平均折扣率是多少
  sql: "SELECT ROUND(SUM(discount_amount) * 1.0 / SUM(total_amount), 4) FROM orders WHERE status <> '已取消'"

- cat: ratio
  batch: v2
  q: 各渠道订单量占比
  sql: "SELECT channel, ROUND(COUNT(*) * 1.0 / (SELECT COUNT(*) FROM orders WHERE status <> '已取消'), 4) FROM orders WHERE status <> '已取消' GROUP BY channel ORDER BY 2 DESC"

# ---- join ----

- cat: join
  batch: v2
  q: 各门店各品类的销量
  sql: "SELECT s.name, c.name, SUM(i.quantity) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY s.name, c.name ORDER BY s.name, c.name"

- cat: join
  batch: v2
  q: 各渠道各品类的销售额
  sql: "SELECT o.channel, c.name, ROUND(SUM(i.amount), 2) FROM order_item i JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id JOIN orders o ON o.id = i.order_id WHERE o.status <> '已取消' GROUP BY o.channel, c.name ORDER BY o.channel, c.name"

- cat: join
  batch: v2
  q: 各门店的退款率
  sql: "SELECT s.name, ROUND(COUNT(DISTINCT r.order_id) * 1.0 / (SELECT COUNT(DISTINCT o2.id) FROM orders o2 WHERE o2.status = '已完成' AND o2.store_id = s.id), 4) FROM refund r JOIN orders o ON o.id = r.order_id JOIN store s ON s.id = o.store_id WHERE r.status = '已退款' AND o.status = '已完成' GROUP BY s.id, s.name ORDER BY 2 DESC"

- cat: join
  batch: v2
  q: 各会员等级在各门店的营收
  sql: "SELECT c.level, s.name, ROUND(SUM(o.total_amount - o.discount_amount), 2) FROM orders o JOIN customer c ON c.id = o.customer_id JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY c.level, s.name ORDER BY c.level, s.name"

- cat: join
  batch: v2
  q: 各品类退款金额占该品类销售额的比例
  sql: "SELECT c.name, ROUND(SUM(r.amount) * 1.0 / (SELECT SUM(i2.amount) FROM order_item i2 JOIN product p2 ON p2.id = i2.product_id JOIN orders o2 ON o2.id = i2.order_id WHERE o2.status <> '已取消' AND p2.category_id = c.id), 4) FROM refund r JOIN order_item i ON i.id = r.order_item_id JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id WHERE r.status = '已退款' GROUP BY c.id, c.name ORDER BY 2 DESC"

- cat: join
  batch: v2
  q: 各门店的平均单价
  sql: "SELECT s.name, ROUND(SUM(i.amount) / SUM(i.quantity), 2) FROM order_item i JOIN orders o ON o.id = i.order_id JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY s.name ORDER BY 2 DESC"

- cat: join
  batch: v2
  q: 各品类各有几笔退款
  sql: "SELECT c.name, COUNT(*) FROM refund r JOIN order_item i ON i.id = r.order_item_id JOIN product p ON p.id = i.product_id JOIN category c ON c.id = p.category_id GROUP BY c.name ORDER BY 2 DESC"

- cat: join
  batch: v2
  q: 各城市的门店营收
  sql: "SELECT s.city, ROUND(SUM(o.total_amount - o.discount_amount), 2) FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' GROUP BY s.city ORDER BY 2 DESC"

# ---- negate ----

- cat: negate
  batch: v2
  q: 从没下过单的客户有多少人
  sql: "SELECT COUNT(*) FROM customer WHERE id NOT IN (SELECT customer_id FROM orders)"

- cat: negate
  batch: v2
  q: 质量问题之外的退款金额是多少
  sql: "SELECT ROUND(SUM(amount), 2) FROM refund WHERE status = '已退款' AND reason <> '质量问题'"

- cat: negate
  batch: v2
  q: 没有用优惠的订单有多少
  sql: "SELECT COUNT(*) FROM orders WHERE status <> '已取消' AND discount_amount = 0"

- cat: negate
  batch: v2
  q: 没有上级分类的品类有几个
  sql: "SELECT COUNT(*) FROM category WHERE parent_name IS NULL"

- cat: negate
  batch: v2
  q: 只下过一单的客户有多少人
  sql: "SELECT COUNT(*) FROM (SELECT customer_id FROM orders WHERE status <> '已取消' GROUP BY customer_id HAVING COUNT(*) = 1)"

- cat: negate
  batch: v2
  q: 没有库存快照的门店有几家
  sql: "SELECT COUNT(*) FROM store WHERE id NOT IN (SELECT DISTINCT store_id FROM inventory_snapshot)"

- cat: negate
  batch: v2
  q: 排除华南区之后的营收
  sql: "SELECT ROUND(SUM(o.total_amount - o.discount_amount), 2) FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' AND s.region <> '华南'"

- cat: negate
  batch: v2
  q: 已驳回的退款有几笔
  sql: "SELECT COUNT(*) FROM refund WHERE status <> '已退款' AND status <> '处理中'"

# ---- snapshot ----

- cat: snapshot
  batch: v2
  q: 深圳南山店最新一天的库存总量
  sql: "SELECT SUM(v.stock) FROM inventory_snapshot v JOIN store s ON s.id = v.store_id WHERE s.name = '深圳南山店' AND v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot)"

- cat: snapshot
  batch: v2
  q: 最近一天库存最多的商品
  sql: "SELECT p.name FROM inventory_snapshot v JOIN product p ON p.id = v.product_id WHERE v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot) GROUP BY p.name ORDER BY SUM(v.stock) DESC LIMIT 1"

- cat: snapshot
  batch: v2
  q: 各门店昨天卖出的商品占库存的比例
  sql: "SELECT s.name, ROUND(SUM(v.sold) * 1.0 / SUM(v.stock), 4) FROM inventory_snapshot v JOIN store s ON s.id = v.store_id WHERE v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot) GROUP BY s.name ORDER BY 2 DESC"

- cat: snapshot
  batch: v2
  q: 库存快照一共有多少条记录
  sql: "SELECT COUNT(*) FROM inventory_snapshot"

- cat: snapshot
  batch: v2
  q: 广州天河店库存最少的 3 个商品
  sql: "SELECT p.name, SUM(v.stock) FROM inventory_snapshot v JOIN product p ON p.id = v.product_id JOIN store s ON s.id = v.store_id WHERE s.name = '广州天河店' AND v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot) GROUP BY p.name ORDER BY 2 ASC LIMIT 3"

- cat: snapshot
  batch: v2
  q: 有库存快照的两个门店昨天一共卖了多少件
  sql: "SELECT SUM(v.sold) FROM inventory_snapshot v WHERE v.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot) AND v.store_id IN (SELECT DISTINCT store_id FROM inventory_snapshot)"

# ---- customer ----

- cat: customer
  batch: v2
  q: 各城市的金卡会员人数
  sql: "SELECT city, COUNT(*) FROM customer WHERE level = '金卡' GROUP BY city ORDER BY 2 DESC"

- cat: customer
  batch: v2
  q: 女性客户贡献了多少营收
  sql: "SELECT ROUND(SUM(o.total_amount - o.discount_amount), 2) FROM orders o JOIN customer c ON c.id = o.customer_id WHERE o.status <> '已取消' AND c.gender = '女'"

- cat: customer
  batch: v2
  q: 各会员等级平均下过几单
  sql: "SELECT c.level, ROUND(COUNT(o.id) * 1.0 / COUNT(DISTINCT c.id), 2) FROM customer c LEFT JOIN orders o ON o.customer_id = c.id AND o.status <> '已取消' GROUP BY c.level ORDER BY 2 DESC"

- cat: customer
  batch: v2
  q: 北京客户的订单量
  sql: "SELECT COUNT(*) FROM orders o JOIN customer c ON c.id = o.customer_id WHERE o.status <> '已取消' AND c.city = '北京'"

- cat: customer
  batch: v2
  q: 这个月新注册的客户有多少人
  sql: "SELECT COUNT(*) FROM customer WHERE registered_at >= date('now','start of month')"
  sql_pg: "SELECT COUNT(*) FROM customer WHERE registered_at >= date_trunc('month', now())"

- cat: customer
  batch: v2
  q: 各会员等级里单笔消费最高是多少
  sql: "SELECT c.level, ROUND(MAX(o.total_amount - o.discount_amount), 2) FROM orders o JOIN customer c ON c.id = o.customer_id WHERE o.status <> '已取消' GROUP BY c.level ORDER BY 2 DESC"

- cat: customer
  batch: v2
  q: 女性客户占全部客户的比例
  sql: "SELECT ROUND(SUM(CASE WHEN gender = '女' THEN 1 ELSE 0 END) * 1.0 / COUNT(*), 4) FROM customer"

- cat: customer
  batch: v2
  q: 各城市下过单的客户平均消费多少钱
  sql: "SELECT c.city, ROUND(SUM(o.total_amount - o.discount_amount) / COUNT(DISTINCT c.id), 2) FROM orders o JOIN customer c ON c.id = o.customer_id WHERE o.status <> '已取消' GROUP BY c.city ORDER BY 2 DESC"

# ---- compare ----

- cat: compare
  batch: v2
  q: 上个月比上上个月多赚了多少
  sql: "SELECT ROUND(SUM(CASE WHEN paid_at >= date('now','start of month','-1 month') THEN total_amount - discount_amount ELSE 0 END) - SUM(CASE WHEN paid_at >= date('now','start of month','-2 months') AND paid_at < date('now','start of month','-1 month') THEN total_amount - discount_amount ELSE 0 END), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of month','-2 months')"
  sql_pg: "SELECT ROUND(SUM(CASE WHEN paid_at >= date_trunc('month', now()) - interval '1 month' THEN total_amount - discount_amount ELSE 0 END) - SUM(CASE WHEN paid_at >= date_trunc('month', now()) - interval '2 months' AND paid_at < date_trunc('month', now()) - interval '1 month' THEN total_amount - discount_amount ELSE 0 END), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('month', now()) - interval '2 months'"

- cat: compare
  batch: v2
  q: 今年比去年同期多赚了多少
  sql: "SELECT ROUND((SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of year')) - (SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of year','-1 year') AND paid_at < date('now','-1 year')), 2)"
  sql_pg: "SELECT ROUND((SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('year', now())) - (SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('year', now()) - interval '1 year' AND paid_at < current_date - interval '1 year'), 2)"

- cat: compare
  batch: v2
  q: 门店渠道和小程序渠道的客单价差多少
  sql: "SELECT ROUND(SUM(CASE WHEN channel = '门店' THEN total_amount - discount_amount ELSE 0 END) / COUNT(DISTINCT CASE WHEN channel = '门店' THEN id END) - SUM(CASE WHEN channel = '小程序' THEN total_amount - discount_amount ELSE 0 END) / COUNT(DISTINCT CASE WHEN channel = '小程序' THEN id END), 2) FROM orders WHERE status <> '已取消'"

- cat: compare
  batch: v2
  q: 最近 7 天比前 7 天多了多少单
  sql: "SELECT SUM(CASE WHEN paid_at >= date('now','-7 days') THEN 1 ELSE 0 END) - SUM(CASE WHEN paid_at >= date('now','-14 days') AND paid_at < date('now','-7 days') THEN 1 ELSE 0 END) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','-14 days')"
  sql_pg: "SELECT SUM(CASE WHEN paid_at >= current_date - 7 THEN 1 ELSE 0 END) - SUM(CASE WHEN paid_at >= current_date - 14 AND paid_at < current_date - 7 THEN 1 ELSE 0 END) FROM orders WHERE status <> '已取消' AND paid_at >= current_date - 14"

- cat: compare
  batch: v2
  q: 深圳门店和上海门店的营收对比
  sql: "SELECT s.city, ROUND(SUM(o.total_amount - o.discount_amount), 2) FROM orders o JOIN store s ON s.id = o.store_id WHERE o.status <> '已取消' AND s.city IN ('深圳','上海') GROUP BY s.city ORDER BY 2 DESC"

- cat: compare
  batch: v2
  q: 金卡会员和普通会员的客单价差多少
  sql: "SELECT ROUND(SUM(CASE WHEN c.level = '金卡' THEN o.total_amount - o.discount_amount ELSE 0 END) / COUNT(DISTINCT CASE WHEN c.level = '金卡' THEN o.id END) - SUM(CASE WHEN c.level = '普通' THEN o.total_amount - o.discount_amount ELSE 0 END) / COUNT(DISTINCT CASE WHEN c.level = '普通' THEN o.id END), 2) FROM orders o JOIN customer c ON c.id = o.customer_id WHERE o.status <> '已取消'"

- cat: compare
  batch: v2
  q: 上个月营收是去年同期的多少倍
  sql: "SELECT ROUND((SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of month','-1 month') AND paid_at < date('now','start of month')) * 1.0 / (SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of month','-1 month','-1 year') AND paid_at < date('now','start of month','-1 year')), 2)"
  sql_pg: "SELECT ROUND((SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('month', now()) - interval '1 month' AND paid_at < date_trunc('month', now())) * 1.0 / (SELECT SUM(total_amount - discount_amount) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('month', now()) - interval '1 month' - interval '1 year' AND paid_at < date_trunc('month', now()) - interval '1 year'), 2)"

- cat: compare
  batch: v2
  q: 天猫和小程序的退款金额差多少
  sql: "SELECT ROUND(SUM(CASE WHEN o.channel = '天猫' THEN r.amount ELSE 0 END) - SUM(CASE WHEN o.channel = '小程序' THEN r.amount ELSE 0 END), 2) FROM refund r JOIN orders o ON o.id = r.order_id WHERE r.status = '已退款'"

- cat: compare
  batch: v2
  q: 线上渠道和门店渠道平均每单优惠差多少
  sql: "SELECT ROUND(AVG(CASE WHEN channel = '门店' THEN 0 ELSE discount_amount END) - AVG(CASE WHEN channel = '门店' THEN discount_amount ELSE 0 END), 2) FROM orders WHERE status <> '已取消'"

- cat: compare
  batch: v2
  q: 最近 30 天和上个月哪个营收更高（各是多少）
  sql: "SELECT '最近30天' AS period, ROUND(SUM(total_amount - discount_amount), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','-30 days') UNION ALL SELECT '上个月', ROUND(SUM(total_amount - discount_amount), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date('now','start of month','-1 month') AND paid_at < date('now','start of month') ORDER BY 2 DESC"
  sql_pg: "SELECT '最近30天' AS period, ROUND(SUM(total_amount - discount_amount), 2) FROM orders WHERE status <> '已取消' AND paid_at >= current_date - 30 UNION ALL SELECT '上个月', ROUND(SUM(total_amount - discount_amount), 2) FROM orders WHERE status <> '已取消' AND paid_at >= date_trunc('month', now()) - interval '1 month' AND paid_at < date_trunc('month', now()) ORDER BY 2 DESC"
