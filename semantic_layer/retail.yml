# 语义层：把「业务口径」从代码里拿出来，变成一份可评审、可 diff 的定义。
#
# 为什么需要它：裸大模型最典型的错法不是写不出 SQL，而是"自信地写错口径"——
# 比如算营收时忘了排除取消单、用 product.price 当成交价、把处理中的退款算进退款额。
# 这些规则模型无法从字段名推断，所以必须在生成之前告诉它、在生成之后检查它。

name: 连锁零售电商
warehouse: sqlite

# ---- 指标定义：模型只能从这些指标里挑，不许自己发明公式 ----
metrics:
  - name: 实收金额
    formula: SUM(orders.total_amount - orders.discount_amount)
    must_filter: orders.status <> '已取消'
    note: 营收口径。取消单没有真实成交，必须排除

  - name: 订单量
    formula: COUNT(DISTINCT orders.id)
    must_filter: orders.status <> '已取消'
    note: 一张订单只算一次，不要用明细行数代替

  - name: 销量
    formula: SUM(order_item.quantity)
    must_filter: orders.status <> '已取消'
    note: 商品件数，来自明细表

  - name: 成交额
    formula: SUM(order_item.amount)
    must_filter: orders.status <> '已取消'
    note: 明细级金额，和「实收金额」的差别在于未扣优惠

  - name: 退款金额
    formula: SUM(refund.amount)
    must_filter: refund.status = '已退款'
    note: 处理中和已驳回的退款不计入

  - name: 退款率
    formula: COUNT(DISTINCT refund.order_id) * 1.0 / COUNT(DISTINCT orders.id)
    must_filter: orders.status = '已完成' AND refund.status = '已退款'
    note: 分子分母都只算已完成订单

  - name: 客单价
    formula: SUM(orders.total_amount - orders.discount_amount) / COUNT(DISTINCT orders.id)
    must_filter: orders.status <> '已取消'
    note: 实收金额 / 订单量

  - name: 退款笔数
    formula: COUNT(*)
    must_filter: 不过滤 status
    note: 口径是「退款申请笔数」，处理中和已驳回也算一笔；只有金额类指标才限已退款

  - name: 库存量
    formula: SUM(inventory_snapshot.stock)
    must_filter: inventory_snapshot.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot)
    note: 库存只能取最新一天；按商品看要把各门店的库存 SUM 起来，不能只取一行

  - name: 当日销量
    formula: SUM(inventory_snapshot.sold)
    must_filter: inventory_snapshot.snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot)
    note: 销量以日终库存快照的 sold 为准（含全渠道），不要从 orders 倒推

# ---- 口径提醒：不进公式、但模型每次都必须知道的坑 ----
conventions:
  - 时间筛选一律用 orders.paid_at，不要用 id 或 created_at 判断成交时间
  - 成交单价用 order_item.unit_price，不是 product.price
  - 「上月」指上一个自然月（date('now','start of month','-1 month') 到下月初）
  - 「今年」指 date('now','start of year') 至今，不是本月、不是近 12 个月
  - 「去年」指 date('now','start of year','-1 year') 到 date('now','start of year')
  - 「最近 N 天」用 paid_at >= date('now','-N days')
  - 客户所在城市 customer.city 与门店城市 store.city 是两回事，问"门店"用 store.city
  - inventory_snapshot 是每日日终快照，库存只能取最新一天 snapshot_date = (SELECT MAX(snapshot_date) FROM inventory_snapshot)，跨日求和会把 30 天的量重复累加
  - 「昨天 / 最近一天 / 当日销量」用最新快照日的 inventory_snapshot.sold 汇总，不要用 paid_at 过滤 orders 倒推
  - 库存快照目前只有深圳南山店、广州天河店有数据，问其他门店要说明无数据
  - 「退款率」的分母是已完成订单，不是全部订单
  - 退款相关的时间筛选用 refund.created_at，不是 orders.paid_at（退款发生在成交之后）

# ---- 已批准的 join：不在表里的组合视为语义错误 ----
approved_joins:
  - [orders, store, "orders.store_id = store.id"]
  - [orders, customer, "orders.customer_id = customer.id"]
  - [order_item, orders, "order_item.order_id = orders.id"]
  - [order_item, product, "order_item.product_id = product.id"]
  - [product, category, "product.category_id = category.id"]
  - [refund, orders, "refund.order_id = orders.id"]
  - [refund, order_item, "refund.order_item_id = order_item.id"]
  - [inventory_snapshot, store, "inventory_snapshot.store_id = store.id"]
  - [inventory_snapshot, product, "inventory_snapshot.product_id = product.id"]

# ---- 示例问答：挑的是最容易写错的几种问法 ----
examples:
  - q: 上个月的总营收是多少
    sql: >
      SELECT ROUND(SUM(total_amount - discount_amount), 2) AS revenue
      FROM orders
      WHERE status <> '已取消'
        AND paid_at >= date('now', 'start of month', '-1 month')
        AND paid_at <  date('now', 'start of month')
  - q: 最近 30 天各门店的订单量和实收，按实收降序
    sql: >
      SELECT s.name AS store, COUNT(DISTINCT o.id) AS order_cnt,
             ROUND(SUM(o.total_amount - o.discount_amount), 2) AS revenue
      FROM orders o JOIN store s ON s.id = o.store_id
      WHERE o.status <> '已取消' AND o.paid_at >= date('now', '-30 days')
      GROUP BY s.name ORDER BY revenue DESC
